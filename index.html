  /* FLOATING CAPTION SWITCH */

.caption-switch{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:9999;

  display:grid;
  place-items:center;
  width:46px;
  height:46px;

  border:1px solid #ffffffd9;
  border-radius:17px;
  background:linear-gradient(145deg,#ffffffc9,#f8eaf590);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  box-shadow:
    0 5px 18px #bd91b638,
    inset 0 1px 3px #ffffff;

  color:#a875a0;
  font-size:19px;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}

.caption-switch i{
  animation:captionLoop 2.8s linear infinite;
}

.caption-switch::before,
.caption-switch::after{
  content:"";
  position:absolute;
  border:1.5px solid transparent;
  border-radius:50%;
  pointer-events:none;
}

.caption-switch::before{
  inset:-5px;
  border-top-color:#d99abd;
  border-right-color:#d99abd;
  animation:captionRing 3s linear infinite;
}

.caption-switch::after{
  inset:-9px;
  border-bottom-color:#bda2e8;
  border-left-color:#bda2e8;
  animation:captionRingReverse 4s linear infinite;
}

.caption-switch:active{
  scale:.88;
}

/* Keep the caption switch hidden while a poem is open. */
#readerScreen:not([hidden]) ~ .caption-switch{
  display:none;
}

@keyframes captionLoop{
  to{transform:rotate(360deg)}
}

@keyframes captionRing{
  to{transform:rotate(360deg)}
}

@keyframes captionRingReverse{
  to{transform:rotate(-360deg)}
}

.poem-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 10px;align-items:stretch}
.poem-folder{
  --folder-color:#ed83b1;--folder-light:#fff0f6;--folder-ink:#a94e78;
  --folder-radius:20px 20px 20px 8px;
  position:relative;isolation:isolate;display:flex;flex-direction:column;
  align-items:center;justify-content:center;min-width:0;min-height:153px;
  padding:15px 7px 13px;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--folder-color) 20%,white);
  border-radius:var(--folder-radius);
  background:radial-gradient(circle at 100% 0%,#ffffffd9,transparent 48%),linear-gradient(145deg,var(--folder-light),#ffffffb8);
  box-shadow:0 8px 22px color-mix(in srgb,var(--folder-color) 13%,transparent),inset 0 1px 0 white;
  color:var(--folder-ink);text-align:center;transition:box-shadow .18s;
}
.poem-folder:before{
  content:"";position:absolute;z-index:-1;width:75px;height:75px;
  right:-30px;top:-32px;border-radius:50%;
  background:var(--folder-color);opacity:.13;
}
.poem-folder:after{
  content:"";position:absolute;z-index:-1;left:9px;right:9px;bottom:5px;
  height:2px;border-radius:5px;
  background:linear-gradient(90deg,transparent,var(--folder-color),transparent);opacity:.35;
}
.poem-folder:active{box-shadow:0 4px 12px #b79ac52b}
.poem-folder:nth-child(3n + 2){translate:0px 0}

.folder-decoration{position:absolute;top:-12px;right:-7px;font-size:46px;color:var(--folder-color);opacity:.15;pointer-events:none}
.folder-icon{display:grid;place-items:center;width:45px;height:45px;flex-shrink:0;margin-bottom:9px;border:1px solid #ffffffd9;border-radius:15px;background:#ffffff8c;font-size:24px;line-height:1}

.screen[hidden]{display:none!important}
.screen{will-change:auto}
.screen.view-enter{animation:screenIn .22s ease-out both}
.screen.view-enter-back{animation:screenBack .20s ease-out both}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes screenBack{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.poem-folder{animation:folderRise .22s ease-out both}
.poem-folder:nth-child(3n + 2){animation-delay:.015s}

/* Box height follows the poem; no forced common height */
.reader-card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  margin-top: 0;
  min-height: 0;
  height: auto;
  padding: 22px 19px 18px;

  /* Pure white stroke */
  border: 2px solid #ffffff;
  border-radius: 25px;

  /* Soft white + light pink background */
  background: #fff5fa;

  /* Lightweight pink shadow */
  box-shadow: 0 0 14px 3px rgba(232, 105, 166, 0.20);
}

/* Small love heart */
.reader-card:before {
  content: "♡";
  position: absolute;
  z-index: -1;
  right: 17px;
  top: 12px;
  color: #e88bb8;
  opacity: 0.25;
  font-size: 32px;
  line-height: 1;
  pointer-events: none;
}

/* Tiny sparkle */
.reader-card:after {
  content: "✧";
  position: absolute;
  z-index: -1;
  left: 14px;
  bottom: 12px;
  color: #d99bc9;
  opacity: 0.3;
  font-size: 21px;
  line-height: 1;
  pointer-events: none;
}
  
.reader-kicker{
  display:block;margin:0 auto 10px;text-align:center;
  color:#c58aaf;font-size:10px;font-weight:700;letter-spacing:1.2px;
}
.reader-title{
  margin:0;color:#74456e;font-size:23px;line-height:1.75;
  font-weight:850;text-align:center;overflow-wrap:anywhere;
}
.reader-divider{
  position:relative;height:1px;margin:16px 0 19px;
  background:linear-gradient(90deg,transparent,#edb4d2,#c7b7f1,transparent);
}
.reader-divider:after{
  content:"♡";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:0 10px;background:#fffafc;color:#d98ab5;font-size:13px;
}

/* The full text height is measured and reserved before typing */
.reader-text{
  display:block;
  width:100%;
  height:auto;
  min-height:0;
  margin:0;
  flex-shrink:0;
  color:#60445d;
  font-size:16px;
  line-height:2.15;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:normal;
}
.reader-text.typing{border:0;outline:0}

.reader-actions{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-top:20px;padding-top:13px;
  border-top:1px solid #f3e1ed;
}
.reader-action{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  min-height:32px;padding:6px 11px;
  border:1px solid #efcfe2;border-radius:11px;
  background:linear-gradient(135deg,#fff0f7,#f5f0ff);
  color:#a65389;font-size:11px;font-weight:700;
  cursor:pointer;transition:transform .16s,background .16s;
}
.reader-action:active{transform:scale(.96)}
.reader-action.share{border-color:#e5d8f6;color:#8268b4;background:linear-gradient(135deg,#f9f3ff,#fff0f7)}
.copy-status{min-height:17px;margin-top:7px;color:#a16e9e;font-size:10px;text-align:center}
.reader-footer{border:0;margin-top:22px;padding-top:0}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBc1EP0Z4aXq9hOjjImY4HNF7hDsxLoVU4",

  messagingSenderId: "112670737432",
  appId: "1:112670737432:web:2b9bbb1e41fcfeb5506f6d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let poemsCache = [];
let loadFailed = false;
let currentPoemId = null;
let folderScrollY = 0;
let typingTimer = null;
let typingToken = 0;

if ("scrollRestoration" in history) history.scrollRestoration = "manual";

const folderScreen = document.getElementById("folderScreen");
const readerScreen = document.getElementById("readerScreen");
const grid = document.getElementById("poemGrid");
const readerText = document.getElementById("readerText");

const folderIcons = [
  "💌","💗","🦋","🌷","🌙","💜","🌸","✨",
  "🪻","☁️","🩷","⭐","🕊️","🍃","🪞","🎀",
  "🫧","🐚","☀️","🪷","🪄","🌿","🧸","🩶"
];

const decorations = [
  "♡","✦","❀","✧","☾","❋","⋆","♥",
  "✿","♡","✦","✧","❦","༄","୨୧","ꕤ",
  "𓆩♡𓆪","⌁","☼","❁","✺","♧","୭","✧"
];

function stableHash(value) {
  const str = String(value || "untitled");
  let hash = 2166136261;
  for (let i = 0; i < str.length; i++) {
    hash ^= str.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function getPoemId(poem, index) {
  if (poem.id !== undefined && poem.id !== null && poem.id !== "")
    return String(poem.id);

  if (poem.uid !== undefined && poem.uid !== null && poem.uid !== "")
    return String(poem.uid);

  return "legacy-" + stableHash(
    String(poem.title || "") + "|" +
    String(poem.date || "") + "|" +
    String(poem.text || poem.content || "") + "|" + index
  );
}

function toBanglaNumber(value) {
  return String(value).replace(/\d/g, digit => "০১২৩৪৫৬৭৮৯"[Number(digit)]);
}

function formatDate(dateValue) {
  if (!dateValue) return "";

  let date;

  if (typeof dateValue === "object" && typeof dateValue.toDate === "function")
    date = dateValue.toDate();
  else if (typeof dateValue === "object" && typeof dateValue.seconds === "number")
    date = new Date(dateValue.seconds * 1000);
  else
    date = new Date(String(dateValue));

  if (Number.isNaN(date.getTime())) return "";

  return date.toLocaleDateString("bn-BD", {
    day: "numeric",
    month: "short",
    year: "numeric"
  });
}

function getPageNumber(poem, index) {
  const value = poem._displayPageNumber ?? poem.pageNumber;
  const number = Number(value);

  return Number.isInteger(number) && number > 0 ? number : index + 1;
}

function showMessage(message, icon = "🌸") {
  const empty = document.createElement("div");
  empty.className = "empty";

  const iconEl = document.createElement("span");
  iconEl.className = "empty-icon";
  iconEl.textContent = icon;

  const msg = document.createElement("span");
  msg.textContent = message;

  empty.append(iconEl, msg);
  grid.replaceChildren(empty);
}

function createFolder(poem, index) {
  const id = getPoemId(poem, index);
  const hash = stableHash(id);

  const themeIndex =
    Number.isInteger(Number(poem.themeIndex)) && poem.themeIndex !== ""
      ? Math.max(0, Math.min(23, Number(poem.themeIndex)))
      : hash % 24;

  const folder = document.createElement("a");
  folder.className = "poem-folder theme-" + themeIndex;
  folder.href = "#poem=" + encodeURIComponent(id);
  folder.setAttribute("aria-label", "কবিতা খুলুন: " + String(poem.title || "নামহীন কবিতা"));

  folder.addEventListener("click", event => {
    event.preventDefault();
    openPoem(id, true);
  });

  const decoration = document.createElement("span");
  decoration.className = "folder-decoration";
  decoration.setAttribute("aria-hidden", "true");
  decoration.textContent = String(poem.decoration || decorations[(hash >>> 4) % decorations.length]);

  const icon = document.createElement("span");
  icon.className = "folder-icon";
  icon.setAttribute("aria-hidden", "true");
  icon.textContent = String(poem.emoji || folderIcons[(hash >>> 8) % folderIcons.length]);

  const page = document.createElement("span");
  page.className = "page-number";
  page.textContent = "পৃষ্ঠা " + toBanglaNumber(getPageNumber(poem, index)).padStart(3, "০");

  const title = document.createElement("span");
  title.className = "poem-title";
  title.textContent = String(poem.title || "নামহীন কবিতা");

  const date = document.createElement("span");
  date.className = "folder-date";
  date.textContent = formatDate(poem.date || poem.createdAt);

  folder.append(decoration, icon, page, title, date);
  return folder;
}

function renderPoems() {
  grid.replaceChildren();

  if (loadFailed) {
    showMessage("কবিতা লোড করা যায়নি। ইন্টারনেট, Firebase Config এবং Firestore Rules পরীক্ষা করে আবার চেষ্টা করো।", "⚠️");

    const retry = document.createElement("button");
    retry.type = "button";
    retry.textContent = "আবার চেষ্টা করো";
    retry.style.cssText = "display:block;margin:12px auto 0;padding:9px 15px;border:1px solid #f1d9e9;border-radius:12px;background:#fff0f7;color:#a65389;cursor:pointer";
    retry.addEventListener("click", loadPoems);

    grid.lastElementChild?.appendChild(retry);
    return;
  }

  if (!poemsCache.length) {
    showMessage("এখনো কোনো কবিতা যোগ করা হয়নি। কবিতা যোগ করলে এখানে দেখা যাবে।");
    return;
  }

  const fragment = document.createDocumentFragment();
  poemsCache.forEach((poem, index) => {
    fragment.appendChild(createFolder(poem || {}, index));
  });

  grid.appendChild(fragment);
}

function animateScreen(screen, back = false) {
  screen.classList.remove("view-enter", "view-enter-back");
  void screen.offsetWidth;
  screen.classList.add(back ? "view-enter-back" : "view-enter");

  screen.addEventListener("animationend", () => {
    screen.classList.remove("view-enter", "view-enter-back");
  }, { once: true });
}

function stopTyping() {
  typingToken++;

  if (typingTimer) {
    clearTimeout(typingTimer);
    typingTimer = null;
  }

  readerText.classList.remove("typing");
}

/*
  Measure the complete poem before animation.
  Reserve its final height so the card won't grow while typing.
*/
function typePoem(text) {
  stopTyping();

  const token = typingToken;
  const card = document.querySelector(".reader-card");

  readerText.style.visibility = "hidden";
  readerText.style.height = "auto";
  readerText.textContent = text;

  // Force layout calculation using the complete text.
  const fullTextHeight = readerText.getBoundingClientRect().height;

  // Lock the final text height before starting the animation.
  readerText.style.height = Math.ceil(fullTextHeight) + "px";
  readerText.textContent = "";
  readerText.style.visibility = "visible";

  const reduceMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduceMotion || text.length > 5000) {
    readerText.textContent = text;
    return;
  }

  readerText.classList.add("typing");

  let i = 0;
  const animatedEnd = Math.min(text.length, 1200);
  const chunk = text.length > 1200 ? 18 : 8;

  function step() {
    if (token !== typingToken) return;

    i = Math.min(i + chunk, animatedEnd);
    readerText.textContent = text.slice(0, i);

    if (i < animatedEnd) {
      typingTimer = setTimeout(step, 12);
    } else {
      readerText.textContent = text;
      readerText.classList.remove("typing");
      typingTimer = null;
    }
  }

  step();
}

function showFolders(restoreScroll = true, animate = true) {
  stopTyping();
  currentPoemId = null;

  readerScreen.hidden = true;
  folderScreen.hidden = false;

  // Do not animate the whole folder screen during the initial Firebase load.
  if (animate) {
    animateScreen(folderScreen, true);
  }

  requestAnimationFrame(() => {
    window.scrollTo({
      top: restoreScroll ? folderScrollY : 0,
      behavior: "auto"
    });
  });
}

function openPoem(id, addHistory) {
  const index = poemsCache.findIndex((poem, i) =>
    getPoemId(poem || {}, i) === String(id)
  );

  if (index === -1) {
    showFolders(false);
    return;
  }

  if (!folderScreen.hidden) folderScrollY = window.scrollY;

  const poem = poemsCache[index] || {};
  currentPoemId = String(id);

  document.getElementById("readerTitle").textContent =
    poem.title || "নামহীন কবিতা";

  document.getElementById("readerPage").textContent =
    "♡ পৃষ্ঠা " + toBanglaNumber(getPageNumber(poem, index)).padStart(3, "০");

  document.getElementById("readerDate").textContent =
    formatDate(poem.date || poem.createdAt) || "তারিখ উল্লেখ নেই";

  document.getElementById("copyStatus").textContent = "";

  // Reveal reader first so the browser can measure the full poem correctly.
  folderScreen.hidden = true;
  readerScreen.hidden = false;

  typePoem(String(poem.text || poem.content || ""));

  animateScreen(readerScreen, false);
  window.scrollTo({ top: 0, behavior: "auto" });

  const targetHash = "#poem=" + encodeURIComponent(String(id));

  if (addHistory && location.hash !== targetHash) {
    history.pushState({ poemId: String(id) }, "", targetHash);
  }
}

function restoreRouteFromHash(skipFolderAnimation = false) {
  const match = location.hash.match(/^#poem=(.+)$/);

  if (match) {
    openPoem(decodeURIComponent(match[1]), false);
  } else {
    showFolders(true, !skipFolderAnimation);
  }
}

document.getElementById("readerBack").addEventListener("click", () => {
  if (location.hash.startsWith("#poem=")) {
    history.back();
  } else {
    showFolders(true);
  }
});

window.addEventListener("popstate", () => restoreRouteFromHash(false));

function getCurrentPoem() {
  return poemsCache.find((item, i) =>
    getPoemId(item || {}, i) === currentPoemId
  ) || {};
}

function getCopyText(poem) {
  return [
    poem.title || "",
    String(poem.text || poem.content || "")
  ].filter(Boolean).join("\n\n");
}

async function copyTextToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return;
  }

  const area = document.createElement("textarea");
  area.value = text;
  area.style.position = "fixed";
  area.style.left = "-9999px";

  document.body.appendChild(area);
  area.select();

  const success = document.execCommand("copy");
  area.remove();

  if (!success) throw new Error("Copy failed");
}

document.getElementById("copyPoem").addEventListener("click", async () => {
  const poem = getCurrentPoem();
  const status = document.getElementById("copyStatus");

  try {
    await copyTextToClipboard(getCopyText(poem));
    status.textContent = "♡ কবিতাটি কপি হয়েছে!";
  } catch (error) {
    status.textContent = "কপি করা যায়নি। আবার চেষ্টা করো।";
  }
});

document.getElementById("sharePoem").addEventListener("click", async () => {
  const poem = getCurrentPoem();
  const status = document.getElementById("copyStatus");
  const text = getCopyText(poem);

  try {
    if (navigator.share) {
      await navigator.share({
        title: poem.title || "মনের ক্যানভাস",
        text
      });
      status.textContent = "♡ শেয়ার অপশন খোলা হয়েছে!";
    } else {
      await copyTextToClipboard(text);
      status.textContent = "♡ শেয়ার সাপোর্ট নেই—কবিতাটি কপি হয়েছে!";
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      status.textContent = "শেয়ার করা যায়নি। আবার চেষ্টা করো।";
    }
  }
});

async function loadPoems() {
  loadFailed = false;
  grid.replaceChildren();

  const loading = document.createElement("div");
  loading.className = "status-message";
  loading.textContent = "🌸 অপেক্ষা করুন,লোড হচ্ছে…";
  grid.appendChild(loading);

  try {
    const snapshot = await getDocs(collection(db, "poems"));

    poemsCache = snapshot.docs.map(doc => ({
      ...doc.data(),
      id: doc.id
    }));

    const time = value => {
      if (value && typeof value.toDate === "function") return value.toDate().getTime();
      if (value && typeof value.seconds === "number") return value.seconds * 1000;

      const parsed = Date.parse(value || "");
      return Number.isNaN(parsed) ? 0 : parsed;
    };

    const usedNumbers = new Set(
      poemsCache.map(p => Number(p.pageNumber))
        .filter(n => Number.isInteger(n) && n > 0)
    );

    const missing = poemsCache
      .filter(p => !(
        Number.isInteger(Number(p.pageNumber)) &&
        p.pageNumber !== "" &&
        Number(p.pageNumber) > 0
      ))
      .sort((a, b) =>
        time(a.createdAt || a.date) - time(b.createdAt || b.date) ||
        String(a.id).localeCompare(String(b.id))
      );

    let nextNumber = 1;

    for (const poem of missing) {
      while (usedNumbers.has(nextNumber)) nextNumber++;

      poem._displayPageNumber = nextNumber;
      usedNumbers.add(nextNumber);
      nextNumber++;
    }

    for (const poem of poemsCache) {
      if (
        Number.isInteger(Number(poem.pageNumber)) &&
        poem.pageNumber !== "" &&
        Number(poem.pageNumber) > 0
      ) {
        poem._displayPageNumber = Number(poem.pageNumber);
      }
    }

    poemsCache.sort((a, b) =>
      Number(b._displayPageNumber || 0) -
      Number(a._displayPageNumber || 0)
    );

    renderPoems();
    // Initial Firebase render should not animate the full folder page.
    restoreRouteFromHash(true);

  } catch (error) {
    console.error("Firebase poems load failed:", error);
    loadFailed = true;
    renderPoems();
  } finally {
    // Show social accounts and footer credit only after Firebase loading finishes.
    document.querySelector(".footer").hidden = false;
  }
}

loadPoems();
</script>
